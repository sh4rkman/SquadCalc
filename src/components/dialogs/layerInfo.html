<dialog id="layerInformation" class="animate__animated animate__zoomIn">
    <form method="dialog">
        <button class="closeModal">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM175 175c9.4-9.4 24.6-9.4 33.9 0l47 47 47-47c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-47 47 47 47c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-47-47-47 47c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l47-47-47-47c-9.4-9.4-9.4-24.6 0-33.9z"/></svg>
        </button>
    </form>

    <h2 data-i18n="common:layerInf">Layer Informations</h2>

    <img class="layerThumbnail unselectable" alt="" draggable="false" onerror="this.style.display='none'">

    <table>
        <tbody>
            <tr>
                <td data-i18n="common:map"></td><td class="infLayerMap"></td>
            </tr>
            <tr>
                <td data-i18n="common:gamemode"></td><td class="infLayerGamemode"></td>
            </tr>
            <tr>
                <td data-i18n="common:version"></td><td class="infLayerVersion"></td>
            </tr>
        </tbody>
    </table>

    <table>
        <tbody>
            <tr>
                <td data-i18n="common:playableArea"></td><td class="infLayerSize"></td>
            </tr>
            <tr>
                <td data-i18n="common:team1Tickets"></td><td class="infLayerTeam1Tickets"></td>
            </tr>
            <tr>
                <td data-i18n="common:team2Tickets"></td><td class="infLayerTeam2Tickets"></td>
            </tr>
        </tbody>
    </table>

    <div class="layerCommandsSection">
        <div class="layerCommandGroup">
            <label class="layerCommandLabel" data-i18n="common:cmdSetNextLayer"></label>
            <div class="layerCommandRow">
                <input type="text" class="layerCommandInput" readonly onclick="this.select()">
                <button type="button" class="layerCommandCopyBtn" aria-label="Copy" data-i18n-title="common:copy">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L400 115.9V320c0 8.8-7.2 16-16 16zM192 384H384c35.3 0 64-28.7 64-64V115.9c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1C357.1 5.1 344.9 0 332.1 0H192c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16H96V128H64z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="layerCommandGroup">
            <label class="layerCommandLabel" data-i18n="common:cmdChangeLayer"></label>
            <div class="layerCommandRow">
                <input type="text" class="layerChangeCommandInput" readonly onclick="this.select()">
                <button type="button" class="layerCommandCopyBtn" aria-label="Copy" data-i18n-title="common:copy">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L400 115.9V320c0 8.8-7.2 16-16 16zM192 384H384c35.3 0 64-28.7 64-64V115.9c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1C357.1 5.1 344.9 0 332.1 0H192c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16H96V128H64z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="layerCommandGroup">
            <label class="layerCommandLabel" data-i18n="common:cmdShareUrl"></label>
            <div class="layerCommandRow">
                <input type="text" class="layerShareUrlInput" readonly onclick="this.select()">
                <button type="button" class="layerCommandCopyBtn" aria-label="Copy" data-i18n-title="common:copy">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L400 115.9V320c0 8.8-7.2 16-16 16zM192 384H384c35.3 0 64-28.7 64-64V115.9c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1C357.1 5.1 344.9 0 332.1 0H192c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16H96V128H64z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

</dialog>
